# SpendWise reverse proxy (installed to /etc/nginx/sites-available/spendwise)

log_format spendwise '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                     'rt=$request_time urt=$upstream_response_time rid=$request_id';

# Rate limiting: general per-IP limit + strict limit on POST /login only
limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;
map $request_method $login_post_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $login_post_key zone=login:10m rate=5r/m;

upstream spendwise_web {
    server 127.0.0.1:8000;
    keepalive 16;
}

# Port 80: only Let's Encrypt checks + redirect everything else to HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/spendwise.access.log spendwise;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://52-65-48-147.sslip.io$request_uri;
    }
}

# Port 443: TLS terminates here, then proxy to the app over plain HTTP on localhost
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name 52-65-48-147.sslip.io;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/52-65-48-147.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/52-65-48-147.sslip.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;


    access_log /var/log/nginx/spendwise.access.log spendwise;
    error_log  /var/log/nginx/spendwise.error.log warn;

    client_max_body_size 5m;

    limit_req_status    429;
    limit_req_log_level warn;

    location = /login {
        limit_req zone=login burst=3 nodelay;
        limit_req zone=perip burst=20 nodelay;
        include snippets/spendwise-proxy.conf;
    }

    location / {
        limit_req zone=perip burst=20 nodelay;
        include snippets/spendwise-proxy.conf;
    }
}
