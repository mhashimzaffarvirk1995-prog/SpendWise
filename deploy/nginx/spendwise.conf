# SpendWise reverse proxy (installed to /etc/nginx/sites-available/spendwise)

log_format spendwise '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                     'rt=$request_time urt=$upstream_response_time rid=$request_id';

upstream spendwise_web {
    server 127.0.0.1:8000;
    keepalive 16;
}

# Port 80: only Let's Encrypt checks + redirect everything else to HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/spendwise.access.log spendwise;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://52-65-48-147.sslip.io$request_uri;
    }
}

# Port 443: TLS terminates here, then proxy to the app over plain HTTP on localhost
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name 52-65-48-147.sslip.io;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/52-65-48-147.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/52-65-48-147.sslip.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;


    access_log /var/log/nginx/spendwise.access.log spendwise;
    error_log  /var/log/nginx/spendwise.error.log warn;

    client_max_body_size 5m;

    location / {
        proxy_pass http://spendwise_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
        proxy_hide_header X-Request-ID;
        add_header       X-Request-ID      $request_id always;
        add_header       Strict-Transport-Security "max-age=86400" always;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
