{% macro icon(name, size=20) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if name == 'grid' %}<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>
{% elif name == 'chart' %}<path d="M4 3v18h17M9 16v-5m5 5V7m5 9V4"/>
{% elif name == 'repeat' %}<path d="m17 2 4 4-4 4M3 11V8a2 2 0 0 1 2-2h16M7 22l-4-4 4-4m14-1v3a2 2 0 0 1-2 2H3"/>
{% elif name == 'goal' %}<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>
{% elif name == 'upload' %}<path d="M12 16V3m-5 5 5-5 5 5M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
{% elif name == 'bell' %}<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>
{% elif name == 'wallet' %}<path d="M21 8H5a2 2 0 0 1 0-4h13v4M3 6v13a2 2 0 0 0 2 2h16V8m0 5h-5v4h5"/>
{% elif name == 'plus' %}<path d="M12 5v14M5 12h14"/>
{% elif name == 'arrow-up' %}<path d="m6 15 12-12M6 3h12v12"/>
{% elif name == 'arrow-down' %}<path d="m6 9 12 12M6 21h12V9"/>
{% elif name == 'search' %}<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>
{% elif name == 'logout' %}<path d="M9 4H4v16h5m5-13 5 5-5 5m-7-5h12"/>
{% elif name == 'menu' %}<path d="M4 6h16M4 12h16M4 18h16"/>
{% elif name == 'close' %}<path d="m6 6 12 12M6 18 18 6"/>
{% elif name == 'check' %}<path d="m5 12 4 4L19 6"/>
{% elif name == 'chevron' %}<path d="m9 5 7 7-7 7"/>
{% elif name == 'download' %}<path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/>
{% elif name == 'calendar' %}<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 11h18"/>
{% else %}<circle cx="12" cy="12" r="9"/><path d="M12 8v5m0 3h.01"/>{% endif %}
</svg>
{%- endmacro %}
{% macro empty(title, description, symbol='wallet') %}
<div class="empty-state"><span class="empty-icon">{{ icon(symbol, 26) }}</span><h3>{{ title }}</h3><p>{{ description }}</p></div>
{% endmacro %}
{% macro field(name, text, value='', type='text', required=true, placeholder='') %}
<div class="field"><label for="{{ name }}">{{ text }}</label><input id="{{ name }}" name="{{ name }}" type="{{ type }}" value="{{ value }}" {% if required %}required{% endif %} placeholder="{{ placeholder }}"></div>
{% endmacro %}
