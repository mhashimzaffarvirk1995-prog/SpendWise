{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}<div class="messages" aria-live="polite" aria-atomic="true">{% for category, message in messages %}
<div class="message {{ category }}" role="{{ 'alert' if category == 'error' else 'status' }}"><span>{{ message }}</span><button type="button" class="icon-button" aria-label="Dismiss message" data-dismiss-message>&times;</button></div>
{% endfor %}</div>{% endif %}{% endwith %}
